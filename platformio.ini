; PlatformIO Project Configuration File
;
; Este projeto tem DOIS firmwares no mesmo repositório, via environments:
;   [env:t-deck]    -> scanner LoRaWAN + GPS + tela (LilyGO T-Deck)
;   [env:heltec-gw] -> receptor/gateway de bancada (Heltec WiFi LoRa 32 V3)
;
; Cada environment compila só a sua pasta em src/ através do build_src_filter,
; mais a pasta common/ (compartilhada). Para buildar/enviar um alvo:
;   pio run -e t-deck
;   pio run -e heltec-gw -t upload
;
; https://docs.platformio.org/page/projectconf.html

; ============================================================
; Base comum a todos os environments.
; ============================================================
[env]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; ============================================================
; T-Deck: scanner LoRaWAN + GPS + tela TFT
; ============================================================
[env:t-deck]
; Compila apenas o firmware do T-Deck (+ common).
build_src_filter = +<common/> +<t-deck/>

; IMPORTANTE: o TFT_eSPI (2.5.43) NAO e compativel com o Arduino core 3.x
; (ESP-IDF 5.x), que causa Core Panic (StoreProhibited) em spi.beginTransaction.
; A base fixa a plataforma em 6.9.0 (Arduino core 2.x), testada pela LilyGO.

; ---- Memoria do T-Deck (16MB flash + OPI PSRAM) ----
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_flags = 
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D BOARD_HAS_PSRAM
	; ---- Configuracao do TFT_eSPI para o display do LilyGO T-Deck ----
	-D USER_SETUP_LOADED=1
	; O painel do T-Deck e um ST7789 240x320.
	-D ST7789_DRIVER=1
	-D TFT_WIDTH=240
	-D TFT_HEIGHT=320
	; No ESP32-S3 a porta FSPI padrao faz o TFT_eSPI 2.5.43 calcular um
	; REG_SPI_BASE invalido -> StoreProhibited (EXCVADDR 0x10) em
	; spi.beginTransaction. Forcar a porta HSPI corrige o calculo.
	-D USE_HSPI_PORT=1
	-D TFT_MISO=38
	-D TFT_MOSI=41
	-D TFT_SCLK=40
	-D TFT_CS=12
	-D TFT_DC=11
	-D TFT_RST=-1
	-D TFT_BL=42
	-D TFT_BACKLIGHT_ON=HIGH
	-D TFT_RGB_ORDER=TFT_RGB
	-D LOAD_GLCD=1
	-D LOAD_FONT2=1
	-D LOAD_FONT4=1
	-D SPI_FREQUENCY=40000000
	-D SPI_READ_FREQUENCY=20000000
lib_deps = 
	jgromes/RadioLib @ ^6.6.0
	mikalhart/TinyGPSPlus @ ^1.0.3
	bodmer/TFT_eSPI@^2.5.43

; ============================================================
; Heltec WiFi LoRa 32 V3: receptor LoRa / gateway de bancada
; ============================================================
[env:heltec-gw]
; Compila apenas o firmware do Heltec (+ common).
build_src_filter = +<common/> +<heltec-gw/>
; No Heltec V3.2 o debug serial sai pela UART0 (ponte CP210x), NAO pelo
; USB-CDC nativo. Por isso NAO ativamos ARDUINO_USB_CDC_ON_BOOT aqui;
; assim 'Serial' aponta para a UART0 e aparece no monitor via CP210x.
build_flags = 
	-D ARDUINO_USB_CDC_ON_BOOT=0
lib_deps = 
	jgromes/RadioLib @ ^6.6.0
	adafruit/Adafruit SSD1306 @ ^2.5.9
	adafruit/Adafruit GFX Library @ ^1.11.9
