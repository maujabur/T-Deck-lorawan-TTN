; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:t-deck]
; IMPORTANTE: o TFT_eSPI (2.5.43) NAO e compativel com o Arduino core 3.x
; (ESP-IDF 5.x), que causa Core Panic (StoreProhibited) em spi.beginTransaction.
; Fixamos a plataforma na ultima serie com Arduino core 2.x (2.0.17),
; que e a stack testada pela LilyGO para o T-Deck.
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; ---- Memoria do T-Deck (16MB flash + OPI PSRAM) ----
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_flags = 
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D BOARD_HAS_PSRAM
	; ---- Configuracao do TFT_eSPI para o display do LilyGO T-Deck ----
	; LilyGO conduz o painel do T-Deck com o driver ILI9341 (conjunto de
	; comandos compativel), exatamente como no firmware de fabrica.
	-D USER_SETUP_LOADED=1
	; O painel do T-Deck e um ST7789 240x320.
	-D ST7789_DRIVER=1
	-D TFT_WIDTH=240
	-D TFT_HEIGHT=320
	; No ESP32-S3 a porta FSPI padrao faz o TFT_eSPI 2.5.43 calcular um
	; REG_SPI_BASE invalido -> StoreProhibited (EXCVADDR 0x10) em
	; spi.beginTransaction. Forcar a porta HSPI corrige o calculo.
	-D USE_HSPI_PORT=1
	-D TFT_MISO=38
	-D TFT_MOSI=41
	-D TFT_SCLK=40
	-D TFT_CS=12
	-D TFT_DC=11
	-D TFT_RST=-1
	-D TFT_BL=42
	-D TFT_BACKLIGHT_ON=HIGH
	; O painel do T-Deck tem as cores invertidas e ordem RGB; sem isto
	; aparecem cores erradas (ex.: texto roxo) e lixo.
	-D TFT_RGB_ORDER=TFT_RGB
	-D LOAD_GLCD=1
	-D LOAD_FONT2=1
	-D LOAD_FONT4=1
	-D SPI_FREQUENCY=40000000
	-D SPI_READ_FREQUENCY=20000000
lib_deps = 
	jgromes/RadioLib @ ^6.6.0
	mikalhart/TinyGPSPlus @ ^1.0.3
	bodmer/TFT_eSPI@^2.5.43
